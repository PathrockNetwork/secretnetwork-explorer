# Secret Network mainnet — CometBFT-family chain config.
#
# RPC/LCD endpoints are interpolated from the environment (${VAR}) so node
# URLs / credentials never live in this file. Values come from .env.
#
# This file + the generic CometBFT adapter is the entire chain-specific
# surface. Adding another Cosmos/CometBFT chain = one new YAML file.

slug: secret-mainnet
name: Secret Network
chain_id: secret-4
family: cometbft

bech32_prefix: secret
denom:
  display: SCRT
  base: uscrt
  exponent: 6

# Primary endpoint, also the fallback when no `endpoints` list is present.
rpc_url: ${SECRET_RPC_URL}
ws_url: ${SECRET_RPC_WS_URL}

# Cosmos LCD (x/staking monikers, commission, jailed; x/slashing signing
# info; governance). Tried in order, preferring whichever answered last.
lcd_url: ${SECRET_LCD_URL}
lcd_urls:
  - ${SECRET_LCD_URL}
  - ${SECRET_LCD_URL_2}

# Failover list, tried in priority order (lower wins). The indexer probes each
# on an interval and switches automatically when the active one degrades; a
# node pinned from the dashboard overrides that until unpinned. Endpoints
# whose ${VAR} is unset are skipped with a warning.
#
# Neither node is an archive: on 2026-10-16 the Pathrock node kept ~1.04M blocks
# and Secret³'s backends ~440k–950k, so BACKFILL_DEPTH must stay well below that.
endpoints:
  - label: Pathrock Network
    rpc_url: ${SECRET_RPC_URL}
    ws_url: ${SECRET_RPC_WS_URL}
    priority: 10
  - label: Secret³
    rpc_url: ${SECRET_RPC_URL_2}
    ws_url: ${SECRET_RPC_WS_URL_2}
    priority: 20

capabilities:
  delegations: true
  governance: true
  slashing: true
  poa: false
